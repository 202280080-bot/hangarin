<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if task %}Edit Task{% else %}Add Task{% endif %} - Hangarin</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 30px 15px;
        }

        .container {
            max-width: 650px;
            margin: auto;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0,0,0,.2);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            width: 65px;
            height: 65px;
            margin: 0 auto 15px;
            border-radius: 18px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
        }

        h1 {
            color: #1f2937;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #374151;
            font-weight: bold;
            font-size: 14px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 13px 14px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 15px;
            background: white;
            outline: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #667eea;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            text-align: center;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
        }

        .btn:hover {
            opacity: .9;
        }

        .message {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .card {
                padding: 25px 20px;
            }

            .row {
                grid-template-columns: 1fr;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">

        <div class="header">
            <div class="logo">H</div>

            <h1>
                {% if task %}
                    Edit Task
                {% else %}
                    Add Task
                {% endif %}
            </h1>

            <p class="subtitle">
                {% if task %}
                    Update your task information
                {% else %}
                    Create a new task
                {% endif %}
            </p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="title">Task Title</label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    value="{% if task %}{{ task.title }}{% endif %}"
                    placeholder="Enter task title"
                    maxlength="255"
                    required
                >
            </div>

            <div class="form-group">
                <label for="description">Description</label>

                <textarea
                    id="description"
                    name="description"
                    placeholder="Enter task description"
                >{% if task %}{{ task.description }}{% endif %}</textarea>
            </div>

            <div class="form-group">
                <label for="deadline">Deadline</label>

                <input
                    type="datetime-local"
                    id="deadline"
                    name="deadline"
                    {% if task and task.deadline %}
                    value="{{ task.deadline|date:'Y-m-d\TH:i' }}"
                    {% endif %}
                >
            </div>

            <div class="row">

                <div class="form-group">
                    <label for="status">Status</label>

                    <select id="status" name="status">
                        <option value="Pending"
                            {% if task and task.status == "Pending" %}selected{% endif %}>
                            Pending
                        </option>

                        <option value="In Progress"
                            {% if task and task.status == "In Progress" %}selected{% endif %}>
                            In Progress
                        </option>

                        <option value="Completed"
                            {% if task and task.status == "Completed" %}selected{% endif %}>
                            Completed
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>

                    <select id="category" name="category" required>
                        <option value="">Select Category</option>

                        {% for category in categories %}
                            <option value="{{ category.id }}"
                                {% if task and task.category_id == category.id %}selected{% endif %}>
                                {{ category.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

            </div>

            <div class="form-group">
                <label for="priority">Priority</label>

                <select id="priority" name="priority" required>
                    <option value="">Select Priority</option>

                    {% for priority in priorities %}
                        <option value="{{ priority.id }}"
                            {% if task and task.priority_id == priority.id %}selected{% endif %}>
                            {{ priority.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="buttons">

                <a href="{% url 'dashboard' %}" class="btn btn-secondary">
                    ← Back
                </a>

                <button type="submit" class="btn btn-primary">
                    {% if task %}
                        Update Task
                    {% else %}
                        Add Task
                    {% endif %}
                </button>

            </div>

        </form>

    </div>
</div>

</body>
</html>
