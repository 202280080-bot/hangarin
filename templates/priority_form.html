<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% if priority %}Edit Priority{% else %}Add Priority{% endif %} - Hangarin
    </title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 18px;
            border-radius: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            font-weight: bold;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.35);
        }

        h1 {
            color: #1f2937;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            color: #374151;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 14px 20px;
            border-radius: 12px;
            text-decoration: none;
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }

        .btn-primary {
            color: white;
            background: linear-gradient(135deg, #667eea, #764ba2);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            color: #374151;
            background: #f3f4f6;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
        }

        @media (max-width: 500px) {
            .card {
                padding: 28px 22px;
            }

            h1 {
                font-size: 24px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="header">
            <div class="logo">H</div>

            <h1>
                {% if priority %}
                    Edit Priority
                {% else %}
                    Add Priority
                {% endif %}
            </h1>

            <p class="subtitle">
                {% if priority %}
                    Update your task priority
                {% else %}
                    Create a new task priority
                {% endif %}
            </p>
        </div>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="name">Priority Name</label>

                <input
                    type="text"
                    name="name"
                    id="name"
                    value="{% if priority %}{{ priority.name }}{% endif %}"
                    placeholder="Example: High, Medium, Low"
                    maxlength="100"
                    required
                    autofocus
                >
            </div>

            <div class="buttons">

                <a href="{% url 'dashboard' %}" class="btn btn-secondary">
                    ← Back
                </a>

                <button type="submit" class="btn btn-primary">
                    {% if priority %}
                        Update Priority
                    {% else %}
                        Add Priority
                    {% endif %}
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
