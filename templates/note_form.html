<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% if note %}Edit Note{% else %}Add Note{% endif %} | Hangarin
    </title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.20);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            width: 60px;
            height: 60px;
            margin: 0 auto 15px;
            border-radius: 18px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
        }

        h1 {
            color: #222;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
            font-size: 14px;
        }

        select,
        textarea {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            background: white;
            font-family: inherit;
            transition: 0.2s;
        }

        select:focus,
        textarea:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.12);
        }

        textarea {
            min-height: 180px;
            resize: vertical;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }

        .btn {
            flex: 1;
            text-decoration: none;
            border: none;
            border-radius: 12px;
            padding: 14px 18px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #f1f3f7;
            color: #444;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
        }

        @media (max-width: 600px) {
            .card {
                padding: 25px 20px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="header">
            <div class="logo">H</div>

            <h1>
                {% if note %}
                    Edit Note
                {% else %}
                    Add Note
                {% endif %}
            </h1>

            <p class="subtitle">
                {% if note %}
                    Update your task note
                {% else %}
                    Add a note to one of your tasks
                {% endif %}
            </p>
        </div>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="task">Task</label>

                <select name="task" id="task" required>
                    <option value="">-- Select Task --</option>

                    {% for task in tasks %}
                        <option
                            value="{{ task.id }}"
                            {% if note and note.task_id == task.id %}
                                selected
                            {% endif %}
                        >
                            {{ task.title }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="content">Note</label>

                <textarea
                    name="content"
                    id="content"
                    placeholder="Write your note here..."
                    required
                >{% if note %}{{ note.content }}{% endif %}</textarea>
            </div>

            <div class="buttons">

                <a href="{% url 'dashboard' %}" class="btn btn-secondary">
                    ← Back
                </a>

                <button type="submit" class="btn btn-primary">
                    {% if note %}
                        Update Note
                    {% else %}
                        Add Note
                    {% endif %}
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
