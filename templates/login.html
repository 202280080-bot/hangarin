<!DOCTYPE html>
<html>
<head>
    <title>Hangarin - Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f3;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            background: white;
            width: 350px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #006633;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: #006633;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #004d26;
        }

        .error {
            background: #ffe5e5;
            color: #cc0000;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            margin-bottom: 15px;
        }

       .register-link {
           text-align: center;
           margin-top: 20px;
           color: #666;
        }

      .register-link a {
          color: #006633;
          font-weight: bold;
          text-decoration: none;
       }

      .register-link a:hover {
         text-decoration: underline;
       }
    </style>
</head>

<body>

<div class="login-box">

    <h1>Hangarin</h1>

    <p class="subtitle">
        Task & To-Do Manager
    </p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label>Username</label>

        <input
            type="text"
            name="username"
            placeholder="Enter username"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >

        <button type="submit">
            Login
        </button>

       <p class="register-link">
    Don't have an account?
    <a href="{% url 'register' %}">Create Account</a>
      </p>

    </form>

</div>

</body>
</html>
