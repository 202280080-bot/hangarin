<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - Hangarin</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            background: linear-gradient(135deg, #667eea, #764ba2);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .register-container {
            width: 100%;
            max-width: 420px;

            background: white;

            padding: 40px;

            border-radius: 15px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.20);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            margin: 0;

            color: #333;

            font-size: 32px;
        }

        .logo p {
            margin-top: 8px;

            color: #777;

            font-size: 14px;
        }

        /* =========================
           MESSAGES
        ========================= */

        .messages {
            margin-bottom: 20px;
        }

        .message {
            padding: 12px;

            border-radius: 8px;

            background: #fee2e2;
            color: #991b1b;

            font-size: 14px;

            text-align: center;
        }

        /* =========================
           FORM
        ========================= */

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            color: #333;

            font-weight: bold;

            font-size: 14px;
        }

        .form-group input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-size: 15px;

            outline: none;

            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: #667eea;

            box-shadow:
                0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        /* =========================
           REGISTER BUTTON
        ========================= */

        .register-button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #667eea;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .register-button:hover {
            background: #5568d8;
        }

        /* =========================
           LOGIN LINK
        ========================= */

        .login-section {
            text-align: center;

            margin-top: 25px;

            padding-top: 20px;

            border-top: 1px solid #eee;

            color: #666;

            font-size: 14px;
        }

        .login-section a {
            color: #667eea;

            text-decoration: none;

            font-weight: bold;
        }

        .login-section a:hover {
            text-decoration: underline;
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            text-align: center;

            margin-top: 25px;

            color: #999;

            font-size: 12px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 480px) {

            .register-container {
                padding: 30px 25px;
            }

            .logo h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="register-container">

        <!-- =========================
             HEADER
        ========================= -->

        <div class="logo">

            <h1>Hangarin</h1>

            <p>
                Create your account
            </p>

        </div>


        <!-- =========================
             MESSAGES
        ========================= -->

        {% if messages %}

            <div class="messages">

                {% for message in messages %}

                    <div class="message">
                        {{ message }}
                    </div>

                {% endfor %}

            </div>

        {% endif %}


        <!-- =========================
             REGISTER FORM
        ========================= -->

        <form
            method="POST"
            action="{% url 'register' %}"
        >

            {% csrf_token %}


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="new-password"
                    required
                >

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    autocomplete="new-password"
                    required
                >

            </div>


            <!-- REGISTER BUTTON -->

            <button
                type="submit"
                class="register-button"
            >
                Create Account
            </button>

        </form>


        <!-- =========================
             LOGIN LINK
        ========================= -->

        <div class="login-section">

            <span>
                Already have an account?
            </span>

            <a href="{% url 'login' %}">
                Login
            </a>

        </div>


        <!-- =========================
             FOOTER
        ========================= -->

        <div class="footer">

            © 2026 Hangarin Task Management System

        </div>

    </div>

</body>
</html>
